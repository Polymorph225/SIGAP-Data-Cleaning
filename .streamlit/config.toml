# Tema dasar Streamlit untuk Data Cleaning SIGAP Bojonegoro.
# Nilainya sengaja sama dengan SIGAP-Bojonegoro supaya widget bawaan
# (sidebar, input, tabel) terlihat senada di kedua aplikasi.
[theme]
base                    = "light"
primaryColor            = "#1e5eff"
backgroundColor         = "#f7f9fc"
secondaryBackgroundColor= "#ffffff"
textColor               = "#0f172a"
font                    = "sans serif"

[client]
toolbarMode = "minimal"
